name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info makes each test binary ~10x larger and slows linking; line
  # numbers in panics are enough for CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-services:
    name: cargo test (Postgres, Redis, MySQL, RabbitMQ, MinIO, SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXSPEED_POSTGRES_URL: postgres://testuser:testpass@127.0.0.1:5432/testdb
      EXSPEED_OFFSET_STORE_POSTGRES_URL: postgres://testuser:testpass@127.0.0.1:5432/testdb
      EXSPEED_OFFSET_STORE_REDIS_URL: redis://127.0.0.1:6379
      EXSPEED_LEASE_POSTGRES_URL: postgres://testuser:testpass@127.0.0.1:5432/testdb
      EXSPEED_LEASE_REDIS_URL: redis://127.0.0.1:6379
      EXSPEED_MYSQL_URL: mysql://exspeed:exspeed@127.0.0.1:3306/exspeed
      EXSPEED_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2f
      EXSPEED_S3_ENDPOINT: http://127.0.0.1:9000
      EXSPEED_S3_ACCESS_KEY: minioadmin
      EXSPEED_S3_SECRET_KEY: minioadmin
      MSSQL_SA_PASSWORD: "Exspeed_Test!1"
      EXSPEED_MSSQL_URL: "mssql://sa:Exspeed_Test!1@127.0.0.1:1433/exspeed?trust_server_certificate=true"
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        # Service containers can't take a command, and CDC needs wal_level=logical.
        # SQL Server needs its Agent for CDC capture; it boots while we build.
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=testuser -e POSTGRES_PASSWORD=testpass -e POSTGRES_DB=testdb \
            postgres:16 -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          docker run -d --name redis -p 6379:6379 redis:7
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=exspeed \
            -e MYSQL_USER=exspeed -e MYSQL_PASSWORD=exspeed mysql:8
          docker run -d --name rabbitmq -p 5672:5672 rabbitmq:3-management
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          docker run -d --name mssql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD -e MSSQL_PID=Developer \
            -e MSSQL_AGENT_ENABLED=true \
            mcr.microsoft.com/mssql/server:2022-latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --tests
      - name: Wait for services
        run: |
          wait_for() {
            local name=$1; shift
            for i in $(seq 1 90); do
              if "$@" >/dev/null 2>&1; then echo "$name ready"; return 0; fi
              sleep 2
            done
            echo "$name did not become ready"
            docker logs "$name" 2>&1 | tail -50
            return 1
          }
          sqlcmd() {
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost \
              -U sa -P "$MSSQL_SA_PASSWORD" "$@"
          }
          wait_for pg docker exec pg pg_isready -U testuser
          wait_for mysql docker exec mysql mysqladmin ping -uroot -proot --silent
          wait_for rabbitmq docker exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity
          wait_for minio curl -sf http://127.0.0.1:9000/minio/health/live
          wait_for mssql sqlcmd -Q "SELECT 1"
          # A user database: CDC can't be enabled on master.
          sqlcmd -Q "IF DB_ID('exspeed') IS NULL CREATE DATABASE exspeed"
      - name: Run service-backed tests
        run: >
          cargo test --workspace --lib --bins
          --test it --test leadership_test --test postgres_lease_test
          --test redis_lease_test
          -- --include-ignored

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    env:
      # The end-to-end tests start this server binary.
      EXSPEED_BIN: ${{ github.workspace }}/target/debug/exspeed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the server for the e2e tests
        run: cargo build -p exspeed --bin exspeed
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/exspeed
      - name: Render single-node and multi-pod values
        run: |
          helm template t deploy/helm/exspeed > /dev/null
          helm template t deploy/helm/exspeed \
            --set replicas=3 \
            --set cluster.postgresUrlSecret=pg \
            --set cluster.replicatorTokenSecret=rep \
            --set tls.secretName=tls \
            --set auth.credentialsSecret=creds \
            --set serviceMonitor.enabled=true \
            --set podDisruptionBudget.enabled=true > /dev/null
          # Multi-pod without the required secrets must fail fast.
          ! helm template t deploy/helm/exspeed --set replicas=3 > /dev/null 2>&1
