# Posts high-value orders (total > 500) to an HTTP endpoint.
#
# Sinks don't transform or filter on payload fields; the filtering is done
# by the `high_value_orders` continuous query (see the README), which writes
# only the matching orders to its own stream. This sink just forwards that
# stream.
[connector]
name = "high-value-notify"
type = "sink"
plugin = "http_sink"
stream = "high_value_orders"

[settings]
url = "https://httpbin.org/post"
method = "POST"
content_type = "application/json"
