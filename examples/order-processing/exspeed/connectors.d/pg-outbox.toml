# Publishes rows inserted into the `outbox_events` table to `order-events`.
#
# mode = "cdc": inserts are streamed through a logical replication slot in
# commit order (Postgres runs with wal_level=logical, see docker-compose.yml).
# Published rows are deleted from the table only after the records are
# durable in Exspeed (cleanup = "delete", the default).
#
# Every record carries an `x-idempotency-key` derived from the row id, so a
# batch replayed after a crash is dropped by the broker: effectively-once
# within the stream's dedup window, at-least-once beyond it.
[connector]
name = "pg-outbox"
type = "source"
plugin = "postgres_outbox"
stream = "order-events"
subject_template = "{aggregate_type}.{event_type}"

[settings]
connection = "postgres://app:secret@postgres:5432/orderdb"
mode = "cdc"
slot_name = "exspeed_orders"
publication_name = "outbox_pub"
table = "outbox_events"
id_column = "id"
aggregate_type_column = "aggregate_type"
event_type_column = "event_type"
payload_column = "payload"
key_column = "aggregate_id"
