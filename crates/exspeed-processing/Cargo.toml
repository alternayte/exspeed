[package]
name = "exspeed-processing"
version = "0.5.0"
edition = "2021"

[dependencies]
exspeed-common = { path = "../exspeed-common" }
exspeed-streams = { path = "../exspeed-streams" }
exspeed-broker = { path = "../exspeed-broker" }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
datafusion = { version = "55.1", default-features = false, features = [
    "sql",
    "datetime_expressions",
    "string_expressions",
    "unicode_expressions",
    "regex_expressions",
    "math_expressions",
    "recursive_protection",
] }
datafusion-functions-json = "0.55.6"
crc32c = { workspace = true }

[dev-dependencies]
tempfile = "3"
exspeed-storage = { path = "../exspeed-storage" }
