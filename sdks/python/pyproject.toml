[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "exspeed"
version = "0.7.0"
description = "Python client for Exspeed (client protocol v2): streams, publishing, durable consumers with push and pull delivery, core messaging, key-value buckets and ExQL queries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Exspeed" }]
keywords = ["exspeed", "streaming", "message-broker", "client", "asyncio", "stream-processing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/alternayte/exspeed/tree/main/sdks/python#readme"
Repository = "https://github.com/alternayte/exspeed"
Issues = "https://github.com/alternayte/exspeed/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/exspeed"]

[tool.hatch.build.targets.sdist]
include = ["src/exspeed", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/e2e"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
ignore = [
  "RUF022",  # __all__ is grouped by topic, not sorted
  "ASYNC109", # `timeout` parameters are part of the public API
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT018"]
"src/exspeed/protocol/messages.py" = ["UP007"]  # the Request/Response unions read better as Union[...]
